<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16263b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCJC Reports">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>CCJC Field Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16263b; --ink-2:#1e3247; --steel:#3d5a73; --brass:#b8862f;
  --paper:#eef1f4; --surface:#ffffff; --line:#d5dbe2; --line-2:#e6eaef;
  --muted:#6a7787; --danger:#b23a3a; --ok:#2f7d4f;
  --shadow:0 1px 2px rgba(22,38,59,.06),0 4px 16px rgba(22,38,59,.08);
  --display:"Barlow Semi Condensed",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--body); color:var(--ink); background:var(--paper);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.01em;line-height:1.1}

/* ---------- App bar ---------- */
.appbar{
  position:sticky;top:0;z-index:20;
  background:var(--ink);color:#fff;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  border-bottom:3px solid var(--brass);
  display:flex;align-items:center;gap:12px;
}
.appbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.appbar .mark{
  width:30px;height:30px;border-radius:7px;flex:none;
  background:linear-gradient(150deg,var(--steel),var(--ink));
  border:1px solid rgba(184,134,47,.6);
  display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:14px;color:var(--brass);
}
.appbar .titles{min-width:0}
.appbar h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#9db2c6}
.iconbtn{
  width:40px;height:40px;border-radius:9px;flex:none;
  display:grid;place-items:center;color:#cfe0ee;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
}
.iconbtn:active{background:rgba(255,255,255,.12)}
.iconbtn svg{width:20px;height:20px}
.back{color:#cfe0ee;display:flex;align-items:center;gap:6px;font-weight:500;padding:8px 6px 8px 0;margin-left:-4px}
.back svg{width:20px;height:20px}

/* ---------- Layout ---------- */
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin:0 0 10px}
.section{margin-top:26px}

/* ---------- Report-type cards ---------- */
.starters{display:grid;gap:12px}
.starter{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);transition:transform .08s ease;
}
.starter:active{transform:scale(.99)}
.starter .glyph{
  width:46px;height:46px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
}
.starter .glyph svg{width:24px;height:24px}
.starter.swppp .glyph{background:linear-gradient(150deg,#2f7d4f,#1f5a39)}
.starter.observation .glyph{background:linear-gradient(150deg,var(--steel),var(--ink))}
.starter.architect .glyph{background:linear-gradient(150deg,var(--brass),#8f6820)}
.starter .txt{flex:1;min-width:0}
.starter .txt b{font-family:var(--display);font-weight:600;font-size:17px;display:block}
.starter .txt span{font-size:13px;color:var(--muted);display:block}
.starter .chev{color:var(--steel);flex:none}
.starter .chev svg{width:20px;height:20px}

/* ---------- Report list ---------- */
.rlist{display:grid;gap:10px}
.rcard{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
}
.rcard:active{background:#f6f8fa}
.rcard .tag{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 7px;border-radius:6px;flex:none;font-weight:500;
}
.tag.swppp{background:#e4f1ea;color:#1f5a39}
.tag.observation{background:#e5edf4;color:var(--ink)}
.tag.architect{background:#f6ecd8;color:#8f6820}
.rcard .rmeta{flex:1;min-width:0}
.rcard .rmeta b{font-weight:600;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .rmeta span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.rcard .rstat{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;flex:none}
.rstat.draft{color:var(--brass)}
.rstat.complete{color:var(--ok)}
.pcount{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-family:var(--mono);font-size:11px}
.pcount svg{width:13px;height:13px}

.empty{
  text-align:center;color:var(--muted);padding:34px 20px;
  border:1px dashed var(--line);border-radius:14px;background:var(--surface);
}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:16px;margin-bottom:4px}
.empty span{font-size:13px}

/* ---------- Report editor ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--ink)}
.field input[type=text],.field textarea,.field select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;color:var(--ink);
}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--steel);outline-offset:0;border-color:transparent}
.placeholder-note{
  background:#eef3f2;border:1px solid #d3e2db;border-left:3px solid var(--ok);
  border-radius:10px;padding:12px 14px;font-size:13px;color:#37544a;
}
.placeholder-note b{font-family:var(--display);color:#1f5a39}

/* ---------- Photos ---------- */
.photohead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.photohead h3{font-size:16px}
.photohead .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.addphoto{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:var(--ink);color:#fff;border-radius:12px;padding:15px;font-weight:600;
  border:1px solid var(--ink);box-shadow:var(--shadow);
}
.addphoto:active{background:#0f1c2d}
.addphoto svg{width:20px;height:20px;color:var(--brass)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pthumb{
  position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;
  background:#dfe5ec;border:1px solid var(--line);
}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .idx{
  position:absolute;top:5px;left:5px;background:rgba(22,38,59,.82);color:#fff;
  font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:5px;
}
.pthumb.spin::after{
  content:"";position:absolute;inset:0;margin:auto;width:22px;height:22px;
  border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Bottom action bar ---------- */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:15;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + var(--safe-bottom));
  display:flex;gap:10px;max-width:640px;margin:0 auto;
}
.btn{
  flex:1;border-radius:11px;padding:14px;font-weight:600;text-align:center;
  border:1px solid transparent;
}
.btn.primary{background:var(--brass);color:#241a06}
.btn.primary:active{background:#a5771f}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:active{background:#eef1f4}
.btn:disabled{opacity:.5}

/* ---------- Sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,20,31,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:18px 18px 0 0;padding:8px 16px calc(20px + var(--safe-bottom));
  transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;
}
.sheet.on{transform:translateY(0)}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .lead{font-size:13px;color:var(--muted);margin-bottom:16px}
.sheet-row{display:flex;gap:10px;margin-top:12px}

.viewer-img{width:100%;border-radius:12px;background:#0c141f;margin-bottom:14px;max-height:52vh;object-fit:contain}
.dangerlink{color:var(--danger);font-weight:600;background:none;padding:12px;width:100%;text-align:center;border-radius:10px;border:1px solid #e6c9c9}
.dangerlink:active{background:#fbf1f1}

/* ---------- Storage chip ---------- */
.storage{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:14px;
}
.storage .bar{flex:1;height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.storage .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--steel),var(--brass));width:0%}
.storage .lab{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;
  z-index:60;opacity:0;pointer-events:none;transition:all .22s;box-shadow:var(--shadow);
  border:1px solid rgba(184,134,47,.4);max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.hint{font-size:12px;color:var(--muted);margin-top:8px;font-family:var(--mono)}

/* ---------- schema form ---------- */
.fsec{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fsec-head{display:flex;align-items:center;gap:9px;background:var(--steel);color:#fff;padding:11px 14px;font-family:var(--display);font-weight:600;font-size:15px;border-left:4px solid var(--brass)}
.fsec-page{font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:rgba(255,255,255,.16);padding:2px 6px;border-radius:5px;flex:none}
.fsec-body{padding:14px}
.fsec-body .field:last-child{margin-bottom:0}
.fcheck{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.fcheck:last-child{border-bottom:none}
.fcheck input{width:22px;height:22px;flex:none;accent-color:var(--steel)}
.fcheck span{font-size:14px}
.tbl-card{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;background:var(--paper)}
.tbl-card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tbl-card-h b{font-family:var(--display);font-size:14px;color:var(--ink)}
.tbl-del{color:var(--danger);font-size:12px;font-weight:600;padding:4px 8px}
.tbl-add{width:100%;background:var(--paper);border:1px dashed var(--steel);color:var(--steel);border-radius:10px;padding:12px;font-weight:600;margin-top:2px}
.tbl-add:active{background:#e7edf2}
.tbl-empty{color:var(--muted);font-size:13px;padding:4px 0 10px}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="appbar">
  <button class="back hidden" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
    Reports
  </button>
  <div class="brand" id="brand">
    <div class="mark">CC</div>
    <div class="titles">
      <h1 id="barTitle">CCJC Field Reports</h1>
      <div class="sub" id="barSub">Justice Center Complex</div>
    </div>
  </div>
  <button class="iconbtn" id="menuBtn" aria-label="Backup & storage">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
  </button>
</header>

<main id="app"></main>

<!-- hidden capture inputs -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galleryInput" accept="image/*" class="hidden" multiple>
<input type="file" id="importInput" accept="application/json,.json" class="hidden">

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grabber"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="pdf-lib.min.js"></script>
<script src="forms-swppp.js"></script>
<script src="forms-observation.js"></script>
<script src="forms-architect.js"></script>
<script>
/* =====================================================================
   CCJC Field Reports — offline plumbing
   Modules: DB (IndexedDB) · Photos (capture→compress→store) · Backup
   The three report forms plug into REPORT_TYPES + renderReport() later.
   ===================================================================== */

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,c) => { const n=document.createElement(t); if(c)n.className=c; return n; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const fmtDate = ts => new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const kb = b => b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
function dataURLtoBlob(d){
  const [head,b64]=d.split(','); const mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2600); }

const BUILD = 7;
const REPORT_TYPES = {
  swppp:       { label:'SWPPP Self-Inspection', short:'SWPPP', blurb:'Stormwater compliance & E&SC inspection' },
  observation: { label:'Superintendent Observation', short:'Observation', blurb:'Field deficiencies, safety & quality log' },
  architect:   { label:'Architect Site Walk', short:'Architect', blurb:'Per-facility observation walk' },
};

/* =====================================================================
   DB — IndexedDB wrapper.  Two stores: reports, photos (blobs).
   Photos live in IndexedDB (not localStorage) so images don't blow the
   ~5MB localStorage quota — this store holds hundreds of MB.
   ===================================================================== */
const DB = (() => {
  const NAME='ccjc_field_v1', VER=1;
  let _db;
  function open(){
    return new Promise((res,rej)=>{
      if(_db) return res(_db);
      const req=indexedDB.open(NAME,VER);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('reports')){
          const s=db.createObjectStore('reports',{keyPath:'id'});
          s.createIndex('updatedAt','updatedAt');
        }
        if(!db.objectStoreNames.contains('photos')){
          const p=db.createObjectStore('photos',{keyPath:'id'});
          p.createIndex('reportId','reportId');
        }
      };
      req.onsuccess=e=>{ _db=e.target.result; res(_db); };
      req.onerror=e=>rej(e.target.error);
    });
  }
  function tx(store,mode='readonly'){ return open().then(db=>db.transaction(store,mode).objectStore(store)); }
  const done = req => new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
  // writes resolve only when the whole transaction COMMITS, so quota/abort
  // failures surface as real errors instead of a false success + missing data.
  function write(store,fn){
    return open().then(db=>new Promise((res,rej)=>{
      let t;
      try{ t=db.transaction(store,'readwrite'); }
      catch(e){ return rej(new Error('tx-open '+(e&&e.name||'')+' '+(e&&e.message||''))); }
      let result;
      const req=fn(t.objectStore(store));
      if(req){ req.onsuccess=()=>{ result=req.result; }; req.onerror=()=>rej(req.error||new Error('req error')); }
      t.oncomplete=()=>res(result);
      t.onabort=()=>rej(t.error||new Error('tx aborted (storage full?)'));
      t.onerror=()=>rej(t.error||new Error('tx error'));
    }));
  }
  return {
    put:(store,val)=>write(store,s=>s.put(val)),
    del:(store,key)=>write(store,s=>s.delete(key)),
    get:(store,key)=>tx(store).then(s=>done(s.get(key))),
    all:(store)=>tx(store).then(s=>done(s.getAll())),
    byIndex:(store,idx,key)=>tx(store).then(s=>done(s.index(idx).getAll(key))),
  };
})();

/* =====================================================================
   Photos — capture → orient → resize/compress → thumbnail → store.
   Full: JPEG, long edge ≤1600px, q0.82.  Thumb: ≤320px, q0.7.
   EXIF orientation handled via createImageBitmap {imageOrientation}.
   ===================================================================== */
const Photos = (() => {
  const urls = new Map();               // photoId -> objectURL (thumb) for cleanup
  const FULL_EDGE=1600, THUMB_EDGE=320, FULL_Q=0.82, THUMB_Q=0.7;

  async function decode(file){
    // createImageBitmap first (handles EXIF orientation); fall back to <img>.
    if('createImageBitmap' in window){
      try{ const b=await createImageBitmap(file,{imageOrientation:'from-image'});
           return {src:b, cleanup:()=>{ try{b.close&&b.close();}catch(_){} }}; }catch(e){}
      try{ const b=await createImageBitmap(file);
           return {src:b, cleanup:()=>{ try{b.close&&b.close();}catch(_){} }}; }catch(e){}
    }
    return await new Promise((res,rej)=>{
      const img=new Image(); const u=URL.createObjectURL(file);
      // keep the object URL alive until AFTER the canvas draw — revoking early
      // blanks the image on some iOS versions, which was breaking encoding.
      img.onload=()=>res({src:img, cleanup:()=>{ try{URL.revokeObjectURL(u);}catch(_){} }});
      img.onerror=()=>{ try{URL.revokeObjectURL(u);}catch(_){} rej(new Error('image decode failed')); };
      img.decoding='async'; img.src=u;
    });
  }
  function canvasToBlob(c,q){
    return new Promise(res=>{
      let settled=false;
      const fallback=()=>{ if(settled)return; settled=true;
        try{ res(dataURLtoBlob(c.toDataURL('image/jpeg',q))); }catch(_){ res(null); } };
      try{
        c.toBlob(b=>{ if(settled)return; if(b){ settled=true; res(b); } else fallback(); },'image/jpeg',q);
        // some engines never fire the callback on failure — guard with a timeout
        setTimeout(fallback,1500);
      }catch(_){ fallback(); }
    });
  }
  async function scaleTo(src,edge,q){
    const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight;
    if(!w||!h) throw new Error('image had no dimensions');
    const r=Math.min(1, edge/Math.max(w,h));
    const cw=Math.max(1,Math.round(w*r)), ch=Math.max(1,Math.round(h*r));
    const c=el('canvas'); c.width=cw; c.height=ch;
    const g=c.getContext('2d'); g.imageSmoothingQuality='high';
    g.drawImage(src,0,0,cw,ch);
    const blob=await canvasToBlob(c,q);
    if(!blob) throw new Error('could not encode image');
    return {blob,w:cw,h:ch};
  }
  async function process(file,reportId){
    let full=null, thumb=null, w=0, h=0, degraded=false, why='';
    try{
      const dec=await decode(file);
      try{
        const f=await scaleTo(dec.src,FULL_EDGE,FULL_Q);
        const t=await scaleTo(dec.src,THUMB_EDGE,THUMB_Q);
        full=f.blob; thumb=t.blob; w=f.w; h=f.h;
      } finally { dec.cleanup && dec.cleanup(); }
    }catch(e){
      degraded=true; why=(e && e.message) ? e.message : String(e);
      console.warn('compress failed, keeping original:', e);
    }
    // Graceful fallback: never lose a real photo. Store the original bytes;
    // it just skips compression. `why` tells us what to fix in compression.
    if(!full){ full=file; }
    if(!thumb){ thumb=full; }
    const rec={ id:uid(), reportId, full, thumb, w, h,
      size:(full && full.size) || 0, type:(file && file.type) || '',
      degraded, why, caption:'', createdAt:Date.now() };
    try{ await DB.put('photos',rec); }
    catch(e){ throw new Error('store: '+((e&&e.name?e.name+' ':'')+(e&&e.message?e.message:String(e)))); }
    return rec;
  }
  function thumbURL(rec){
    if(!rec || !rec.thumb) return '';
    if(!urls.has(rec.id)) urls.set(rec.id, URL.createObjectURL(rec.thumb));
    return urls.get(rec.id);
  }
  function fullURL(rec){ return URL.createObjectURL(rec.full); } // caller revokes
  async function remove(id){
    await DB.del('photos',id);
    if(urls.has(id)){ URL.revokeObjectURL(urls.get(id)); urls.delete(id); }
  }
  function forget(id){ if(urls.has(id)){ URL.revokeObjectURL(urls.get(id)); urls.delete(id); } }
  return { process, thumbURL, fullURL, remove, forget };
})();

/* =====================================================================
   Backup — export everything to one JSON (photos as base64 data URLs),
   and import/merge it back.  Portable across devices; last-write-wins.
   ===================================================================== */
const Backup = (() => {
  const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); });
  function dataURLtoBlob(d){
    const [head,b64]=d.split(','); const mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg';
    const bin=atob(b64); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }
  async function exportAll(){
    const reports=await DB.all('reports');
    const photosRaw=await DB.all('photos');
    const photos=[];
    for(const p of photosRaw){
      photos.push({ id:p.id, reportId:p.reportId, caption:p.caption, w:p.w, h:p.h,
        size:p.size, createdAt:p.createdAt,
        full:await blobToDataURL(p.full), thumb:await blobToDataURL(p.thumb) });
    }
    const payload={ app:'ccjc-field-reports', version:1, exportedAt:Date.now(), reports, photos };
    const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
    const a=el('a'); a.href=URL.createObjectURL(blob);
    a.download=`CCJC_FieldReports_${new Date().toISOString().slice(0,10)}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    return { reports:reports.length, photos:photos.length };
  }
  async function importAll(file){
    const text=await file.text();
    const data=JSON.parse(text);
    if(data.app!=='ccjc-field-reports') throw new Error('Not a CCJC backup file');
    for(const r of (data.reports||[])) await DB.put('reports',r);
    for(const p of (data.photos||[])){
      await DB.put('photos',{ id:p.id, reportId:p.reportId, caption:p.caption||'',
        w:p.w, h:p.h, size:p.size, createdAt:p.createdAt,
        full:dataURLtoBlob(p.full), thumb:dataURLtoBlob(p.thumb) });
    }
    return { reports:(data.reports||[]).length, photos:(data.photos||[]).length };
  }
  return { exportAll, importAll };
})();

/* ---------- schema form engine ---------- */
function renderSchemaForm(app, r, schema){
  for(const sec of schema.sections){
    if(sec.kind==='photos') continue; // photo capture UI handles these
    const wrap=el('div','fsec');
    const head=el('div','fsec-head');
    head.innerHTML=`<span class="fsec-page">P${sec.page}</span> ${escapeHTML(sec.title)}`;
    wrap.append(head);
    const body=el('div','fsec-body');
    if(sec.kind==='table') renderTableSection(body, r, sec);
    else for(const it of sec.items) body.append(renderFieldInput(r, it));
    wrap.append(body); app.append(wrap);
  }
}
function renderFieldInput(r, it){
  const val=r.data[it.name];
  if(it.type==='check'){
    const row=el('label','fcheck');
    const cb=el('input'); cb.type='checkbox'; cb.checked=!!val;
    cb.onchange=()=>saveField('data.'+it.name, cb.checked);
    const sp=el('span'); sp.textContent=it.label||it.name;
    row.append(cb,sp); return row;
  }
  const f=el('div','field');
  const lab=el('label'); lab.textContent=it.label||it.name; f.append(lab);
  const inp = it.multiline ? el('textarea') : el('input');
  if(!it.multiline){ inp.type='text'; }
  inp.value = (val!=null) ? val : '';
  inp.oninput=()=>saveField('data.'+it.name, inp.value);
  f.append(inp); return f;
}
function renderTableSection(body, r, sec){
  const key='tbl_'+sec.prefix;
  if(!Array.isArray(r.data[key])) r.data[key]=[];
  const entries=r.data[key];
  const list=el('div'); body.append(list);
  const draw=()=>{
    list.innerHTML='';
    if(!entries.length){ const e=el('div','tbl-empty'); e.textContent='No entries yet.'; list.append(e); }
    entries.forEach((entry,i)=>{
      const card=el('div','tbl-card');
      const h=el('div','tbl-card-h'); const b=el('b'); b.textContent=`Entry ${i+1}`;
      const rm=el('button','tbl-del'); rm.textContent='Remove';
      rm.onclick=()=>{ entries.splice(i,1); persistTable(r,key,entries); draw(); };
      h.append(b,rm); card.append(h);
      for(const col of sec.columns){
        const f=el('div','field');
        const lab=el('label'); lab.textContent=col.label; f.append(lab);
        const inp=el('input'); inp.type='text'; inp.value=entry[col.key]||'';
        inp.oninput=()=>{ entry[col.key]=inp.value; persistTable(r,key,entries); };
        f.append(inp); card.append(f);
      }
      list.append(card);
    });
  };
  draw();
  const add=el('button','tbl-add'); add.textContent='+ Add entry';
  add.onclick=()=>{ if(entries.length>=sec.rows){ toast('This log holds up to '+sec.rows+' rows'); return; } entries.push({}); persistTable(r,key,entries); draw(); };
  body.append(add);
}
async function persistTable(r,key,entries){
  const rr=await DB.get('reports',r.id); if(!rr) return;
  rr.data[key]=entries; rr.updatedAt=Date.now(); await DB.put('reports',rr);
}

/* ---------- on-device PDF fill (offline, pdf-lib) ---------- */
function b64ToBytes(b64){ const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
async function deliver(bytes, filename){
  const blob=new Blob([bytes],{type:'application/pdf'});
  try{
    const file=new File([blob],filename,{type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename}); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const url=URL.createObjectURL(blob);
  const a=el('a'); a.href=url; a.download=filename; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function generateForm(r, schema){
  if(!window.PDFLib){ showError('PDF engine not loaded','pdf-lib.min.js did not load. Reload the app once while online so it caches.'); return; }
  toast('Building official PDF…');
  try{
    const { PDFDocument } = PDFLib;
    const doc=await PDFDocument.load(b64ToBytes(window.CCJC_FORMS[r.type].pdf_b64));
    const form=doc.getForm();
    const setText=(n,v)=>{ try{ form.getTextField(n).setText(v==null?'':String(v)); }catch(e){} };
    const setCheck=(n,v)=>{ try{ const f=form.getCheckBox(n); v?f.check():f.uncheck(); }catch(e){} };
    for(const sec of schema.sections){
      if(sec.kind==='table'||sec.kind==='photos') continue;
      for(const it of sec.items){
        const v=r.data[it.name];
        if(it.type==='check') setCheck(it.name, !!v);
        else if(v!=null && v!=='') setText(it.name, v);
      }
    }
    for(const sec of schema.sections){
      if(sec.kind!=='table') continue;
      const entries=Array.isArray(r.data['tbl_'+sec.prefix])?r.data['tbl_'+sec.prefix]:[];
      entries.slice(0,sec.rows).forEach((entry,i)=>{
        sec.columns.forEach((col,ci)=>{
          const v=entry[col.key]; if(v!=null&&v!=='') setText(`${sec.prefix}_r${i}_c${ci}`, v);
        });
      });
    }
    const psec=schema.sections.find(s=>s.kind==='photos');
    if(psec && psec.slots){
      const photos=await DB.byIndex('photos','reportId',r.id);
      const map=new Map(photos.map(p=>[p.id,p]));
      const ordered=(r.photoOrder||[]).map(id=>map.get(id)).filter(Boolean);
      const pages=doc.getPages(); const page=pages[psec.page-1];
      for(let i=0;i<psec.slots.length && i<ordered.length;i++){
        const slot=psec.slots[i], ph=ordered[i];
        try{
          const buf=await ph.full.arrayBuffer();
          let img=null;
          try{ img=await doc.embedJpg(buf); }catch(e){ try{ img=await doc.embedPng(buf); }catch(_){ } }
          if(img){
            const [x,y,w,h]=slot.img_rect;
            const s=Math.min(w/img.width, h/img.height);
            const dw=img.width*s, dh=img.height*s;
            page.drawImage(img,{x:x+(w-dw)/2, y:y+(h-dh)/2, width:dw, height:dh});
          }
        }catch(e){ console.warn('photo embed failed', e); }
        if(ph.caption) setText(slot.desc, ph.caption);
        setText(slot.date, new Date(ph.createdAt).toLocaleDateString());
      }
    }
    const out=await doc.save();
    const base=(r.title?r.title.replace(/[^\w-]+/g,'_'):schema.file);
    await deliver(out, base+'.pdf');
    toast('Official PDF ready');
  }catch(e){ console.error(e); showError('PDF generation failed', (e&&e.message)||String(e)); }
}

let pendingReportId=null;
function openPhotoPicker(reportId){
  pendingReportId=reportId;
  openSheet(`<h3>Add photos</h3><p class="lead">Snap a new one or pick from your library.</p>
    <button class="btn primary" id="shCam" style="width:100%;margin-top:6px">Take photo</button>
    <button class="btn ghost" id="shGal" style="width:100%;margin-top:10px">Choose from library</button>`);
  $('#shCam').onclick=()=>{ closeSheet(); $('#cameraInput').click(); };
  $('#shGal').onclick=()=>{ closeSheet(); $('#galleryInput').click(); };
}
async function handleFiles(files){
  if(!pendingReportId) return;
  files=Array.from(files||[]);
  if(!files.length){ toast('No photo came through — try again'); return; }
  const r=await DB.get('reports',pendingReportId); if(!r) return;
  const grid=$('#pgrid');
  toast(`Adding ${files.length} photo${files.length>1?'s':''}…`);
  let ok=0, degraded=0, why='';
  const fails=[];
  for(const file of files){
    const cell=el('div','pthumb spin'); if(grid) grid.append(cell);
    try{
      const rec=await Photos.process(file,r.id);
      r.photoOrder=[...(r.photoOrder||[]),rec.id];
      r.updatedAt=Date.now();
      await DB.put('reports',r);
      cell.remove(); ok++;
      if(rec.degraded){ degraded++; why=rec.why||why; }
    }catch(e){
      cell.remove();
      fails.push(`file: ${(file&&file.name)||'(from camera)'}\ntype: ${(file&&file.type)||'?'} · ${file?kb(file.size):'?'}\nerror: ${e&&e.message?e.message:String(e)}`);
      console.error('photo save failed:', e);
    }
  }
  await renderPhotoGrid(r);
  updateStorage();
  if(ok && degraded){ toast(`${ok} added — ${degraded} stored uncompressed (${why})`); }
  else if(ok){ toast(`${ok} photo${ok>1?'s':''} added`); }
  else {
    toast('Photo failed — details shown');
    let env=`build ${BUILD} · secure:${window.isSecureContext} · bitmap:${'createImageBitmap' in window} · idb:${!!window.indexedDB}`;
    try{
      if(navigator.storage&&navigator.storage.estimate){
        const est=await navigator.storage.estimate();
        env+=`\nstorage: ${est.usage!=null?kb(est.usage)+' / '+kb(est.quota):'n/a'}`;
      }
    }catch(_){}
    showError('Photo failed', fails.join('\n\n')+'\n\n'+env);
  }
}
function showError(title, detail){
  openSheet(`<h3>${escapeHTML(title)}</h3>
    <p class="lead">Screenshot or copy this and send it — it names exactly what failed.</p>
    <pre style="white-space:pre-wrap;word-break:break-word;background:#0c141f;color:#cfe0ee;padding:12px;border-radius:10px;font:12px/1.5 var(--mono);max-height:42vh;overflow:auto;margin:0">${escapeHTML(detail)}</pre>
    <button class="btn ghost" id="errCopy" style="width:100%;margin-top:12px">Copy details</button>`);
  const cbtn=$('#errCopy');
  if(cbtn) cbtn.onclick=async()=>{ try{ await navigator.clipboard.writeText(detail); toast('Copied'); }catch(_){ toast('Select the text above to copy'); } };
}

    <div class="field"><label for="cap">Caption</label>
      <input id="cap" type="text" value="${escapeAttr(p.caption||'')}" placeholder="What this shows"></div>
    <div class="hint">${p.w&&p.h?`${p.w}×${p.h} · `:''}${kb(p.size)}${p.type?` · ${p.type}`:''} · ${fmtDate(p.createdAt)}${p.degraded?` · stored uncompressed (${escapeHTML(p.why||'')})`:''}</div>
    <button class="dangerlink" id="delPhoto" style="margin-top:14px">Remove photo</button>`,
    ()=>URL.revokeObjectURL(url));
  $('#cap').onchange=async e=>{ p.caption=e.target.value; await DB.put('photos',p); toast('Caption saved'); };
  $('#delPhoto').onclick=async()=>{
    const rr=await DB.get('reports',r.id);
    rr.photoOrder=(rr.photoOrder||[]).filter(id=>id!==p.id); rr.updatedAt=Date.now();
    await DB.put('reports',rr); await Photos.remove(p.id);
    closeSheet(); await renderPhotoGrid(rr); updateStorage(); toast('Photo removed');
  };
}

/* ---------- report mutations ---------- */
async function saveField(path,val){
  const r=await DB.get('reports',state.reportId); if(!r) return;
  if(path.startsWith('data.')) r.data[path.slice(5)]=val; else r[path]=val;
  r.updatedAt=Date.now(); await DB.put('reports',r);
}
async function toggleComplete(r){
  const rr=await DB.get('reports',r.id);
  rr.status=rr.status==='complete'?'draft':'complete'; rr.updatedAt=Date.now();
  await DB.put('reports',rr);
  toast(rr.status==='complete'?'Marked complete':'Reopened'); renderReport();
}
function confirmDelete(r){
  openSheet(`<h3>Delete this report?</h3><p class="lead">This removes the report and its ${(r.photoOrder||[]).length} photo(s) from this device. Can't be undone.</p>
    <button class="dangerlink" id="delYes">Delete report</button>
    <button class="btn ghost" id="delNo" style="width:100%;margin-top:10px">Keep it</button>`);
  $('#delNo').onclick=closeSheet;
  $('#delYes').onclick=async()=>{
    const photos=await DB.byIndex('photos','reportId',r.id);
    for(const p of photos){ await Photos.remove(p.id); }
    await DB.del('reports',r.id);
    closeSheet(); const bar=$('#actionbar'); if(bar)bar.remove(); go('home'); toast('Report deleted');
  };
}

/* ---------- backup menu ---------- */
function openMenu(){
  openSheet(`<h3>Backup & storage</h3><p class="lead">Reports and photos live on this device. Export a backup file to move them to another phone or keep them safe.</p>
    <button class="btn primary" id="mExport" style="width:100%">Export backup (.json)</button>
    <button class="btn ghost" id="mImport" style="width:100%;margin-top:10px">Import a backup</button>
    <div class="storage" style="margin-top:16px"><div class="bar"><i id="storFill2"></i></div><div class="lab" id="storLab2">…</div></div>`);
  updateStorage();
  $('#mExport').onclick=async()=>{ toast('Building backup…'); try{ const s=await Backup.exportAll(); closeSheet(); toast(`Exported ${s.reports} reports · ${s.photos} photos`);}catch(e){toast('Export failed');console.error(e);} };
  $('#mImport').onclick=()=>{ closeSheet(); $('#importInput').click(); };
}

/* ---------- storage meter ---------- */
async function updateStorage(){
  if(!navigator.storage||!navigator.storage.estimate) return;
  try{
    const {usage=0,quota=0}=await navigator.storage.estimate();
    const pct=quota?Math.min(100,usage/quota*100):0;
    ['storFill','storFill2'].forEach(id=>{const n=document.getElementById(id); if(n)n.style.width=pct.toFixed(1)+'%';});
    ['storLab','storLab2'].forEach(id=>{const n=document.getElementById(id); if(n)n.textContent=`${kb(usage)} used of ${kb(quota)}`;});
  }catch(e){}
}

/* ---------- sheet controls ---------- */
let sheetCleanup=null;
function openSheet(html,cleanup){
  $('#sheetBody').innerHTML=html; sheetCleanup=cleanup||null;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet(){
  $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  if(sheetCleanup){ try{sheetCleanup();}catch(e){} sheetCleanup=null; }
}

/* ---------- escaping ---------- */
function escapeHTML(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- glyphs ---------- */
const GLYPH={
  swppp:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.7C12 2.7 5 10 5 15a7 7 0 0 0 14 0c0-5-7-12.3-7-12.3z"/></svg>`,
  observation:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
  architect:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M6 21V9l6-4 6 4v12M10 21v-5h4v5"/></svg>`,
};

/* ---------- wire up ---------- */
$('#backBtn').onclick=()=>{ const bar=$('#actionbar'); if(bar)bar.remove(); go('home'); };
$('#menuBtn').onclick=openMenu;
$('#scrim').onclick=closeSheet;
$('#cameraInput').onchange=e=>{ const fs=Array.from(e.target.files||[]); e.target.value=''; handleFiles(fs); };
$('#galleryInput').onchange=e=>{ const fs=Array.from(e.target.files||[]); e.target.value=''; handleFiles(fs); };
$('#importInput').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  toast('Importing…');
  try{ const s=await Backup.importAll(f); toast(`Imported ${s.reports} reports · ${s.photos} photos`); if(state.view==='home')renderHome(); else renderReport(); }
  catch(err){ toast(err.message||'Import failed'); console.error(err); }
};

/* ---------- PWA: register SW + ask for persistent storage ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

/* ---------- go ---------- */
render();

/* storage self-check: if IndexedDB can't be opened, say so plainly */
DB.all('reports').catch(e=>{
  showError('Storage unavailable',
    'This device blocked the app\'s local storage (IndexedDB), so nothing can be saved.\n\n'+
    'error: '+(e&&e.message?e.message:String(e))+'\n'+
    'build '+BUILD+' · secure:'+window.isSecureContext+'\n\n'+
    'Most common cause: the page is open in Private Browsing, or was launched from an old tab instead of the installed icon.');
});
</script>
</body>
</html>
